# Please see the documentation for all configuration options:
# https://github.com/rhysd/actionlint/blob/main/docs/config.md#configuration-file

paths:
  .github/workflows/main.yml:
    ignore:
      # actionlint does not yet recognize GitHub's self-repository action syntax.
      - 'reusable workflow call "\$/.github/workflows/(build-lint-test|publish-release).yml" at "uses" is not following the format.+'
